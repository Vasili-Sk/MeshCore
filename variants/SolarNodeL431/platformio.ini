[SolarNodeL431]
extends = stm32_base
board = stm32l431cct6
;board_upload.maximum_size = 229376 ; 32kb for FS
build_flags = ${stm32_base.build_flags}
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D SPI_INTERFACES_COUNT=2
  -D LORA_FREQ=868.731
  -D LORA_BW=62.5
  -D LORA_SF=8
  -D LORA_CR=6
  -D ADMIN_PASSWORD='"password"'
  -fsingle-precision-constant
  -Wall
  -Wextra
  -Wdouble-promotion
  -I variants/SolarNodeL431
  -Wl,-Map=output.map
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections
  -g
  
build_src_filter = ${stm32_base.build_src_filter}
  +<../variants/SolarNodeL431>
  +<../lib/STM32-W25Q-QSPI>
  +<../src/helpers/w25qFS>

[env:SolarNodeL431_repeater]
extends = SolarNodeL431
build_flags = ${SolarNodeL431.build_flags}
  -D ADVERT_NAME='"SolarNodeL431 Repeater"'
  -D MAX_NEIGHBOURS=100
build_src_filter = ${SolarNodeL431.build_src_filter}
  +<../examples/simple_repeater/*.cpp>

[env:SolarNodeL431_sensor]
extends = SolarNodeL431
build_flags = ${SolarNodeL431.build_flags}
  -D ADVERT_NAME='"SolarNodeL431 Sensor"'
build_src_filter = ${SolarNodeL431.build_src_filter}
  +<../examples/simple_sensor>

